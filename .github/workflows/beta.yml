name: beta
# Manual only. Builds the Expo app on a Mac runner and uploads it to TestFlight.
on:
  workflow_dispatch:
    inputs:
      regenerate_profiles:
        description: Rebuild signing profiles after a capability change
        type: boolean
        default: false
concurrency:
  group: beta
  cancel-in-progress: false
jobs:
  upload:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode 26
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.MATCH_DEPLOY_KEY }}
      - run: ssh-keyscan -H github.com >> ~/.ssh/known_hosts
      - name: Install JavaScript dependencies
        working-directory: app
        run: npm ci
      - name: Generate the native iOS project
        working-directory: app
        run: npx expo prebuild --platform ios --clean
      - run: which fastlane || brew install fastlane
      - run: fastlane beta
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_FORCE: ${{ inputs.regenerate_profiles && '1' || '0' }}
